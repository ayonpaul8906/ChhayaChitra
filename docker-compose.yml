version: '3.8'

services:
  nextjs-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9002:9002"
    environment:
      # Add any necessary environment variables here.
      # For example, if you use Firebase or other services that require credentials.
      # Example: FIREBASE_API_KEY: ${FIREBASE_API_KEY}
      # Example: GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      NODE_ENV: production
      PORT: 9002
    # volumes:
      # Uncomment and configure if you need to persist data or mount local code for development
      # - .:/app
      # - /app/node_modules
    restart: unless-stopped

